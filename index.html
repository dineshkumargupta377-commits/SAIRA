<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIRA AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: radial-gradient(circle at center, #06182c 0%, #020810 100%);
      color: #00f0ff;
      height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 15px;
    }
    .header {
      width: 100%;
      text-align: center;
      border-bottom: 2px solid #ff9900;
      padding-bottom: 8px;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
      position: relative;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: 6px;
      color: #1ef3ff;
      text-shadow: 0 0 15px #00d9ff, 2px 2px 0px #ff9900;
    }
    .subtitle { font-size: 0.7rem; color: #ff9900; letter-spacing: 1.5px; margin-top: 2px; }
    
    /* तीन डॉट मेनू बटन */
    .menu-btn {
      position: absolute;
      right: 5px;
      top: 5px;
      background: transparent;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-size: 1.3rem;
      padding: 2px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    #dropdownMenu {
      display: none;
      position: absolute;
      right: 5px;
      top: 42px;
      background: #06182c;
      border: 1px solid #ff9900;
      border-radius: 10px;
      padding: 8px;
      z-index: 50;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    #dropdownMenu button {
      background: rgba(255, 153, 0, 0.2);
      color: #ff9900;
      border: 1px solid #ff9900;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Key डालने वाला बॉक्स */
    #keyModal {
      display: none;
      position: fixed;
      top: 25%;
      left: 8%;
      width: 84%;
      background: #06182c;
      border: 2px solid #ff9900;
      padding: 20px;
      border-radius: 15px;
      z-index: 100;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
    }
    #keyInput {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #00f0ff;
      background: #020810;
      color: #ffffff;
      font-size: 0.9rem;
    }
    .save-btn {
      background: #00f0ff;
      color: #020810;
      border: none;
      padding: 10px 25px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 8px;
    }
    .close-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    canvas { display: block; max-width: 100%; }
    .controls { text-align: center; width: 100%; }
    #status {
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: #a0e9ff;
      min-height: 45px;
      max-height: 85px;
      overflow-y: auto;
      padding: 0 10px;
    }
    button.mic {
      background: rgba(0, 240, 255, 0.15);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      padding: 14px 38px;
      font-size: 1.1rem;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    button.mic.listening {
      background: #00f0ff;
      color: #020810;
      border-color: #ff9900;
      box-shadow: 0 0 25px #ff9900;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AIRA</h1>
    <div class="subtitle">PERSONAL AI OF DINESH KUMAR GUPTA</div>
    <button class="menu-btn" onclick="toggleMenu()">⋮</button>
    <div id="dropdownMenu">
      <button onclick="openKeyModal()">🔑 API Key सेट करें</button>
    </div>
  </div>

  <div id="keyModal">
    <p style="color:#ff9900; font-weight:bold;">अपनी API Key पेस्ट करें सर:</p>
    <input type="text" id="keyInput" placeholder="AQ.Ab8... या AIzaSy...">
    <button class="save-btn" onclick="saveApiKey()">Save करें</button>
    <button class="close-btn" onclick="closeKeyModal()">बंद करें</button>
  </div>

  <canvas id="sphereCanvas" width="290" height="290"></canvas>

  <div class="controls">
    <div id="status">नमस्ते सर, ऊपर ⋮ दबाकर Key डालें और बोलें...</div>
    <button id="micBtn" class="mic">🎤 Speak / बोलें</button>
  </div>

  <script>
    function toggleMenu() {
      const m = document.getElementById('dropdownMenu');
      m.style.display = (m.style.display === 'block') ? 'none' : 'block';
    }

    function openKeyModal() {
      document.getElementById('dropdownMenu').style.display = 'none';
      document.getElementById('keyInput').value = localStorage.getItem('aira_api_key') || '';
      document.getElementById('keyModal').style.display = 'block';
    }

    function closeKeyModal() {
      document.getElementById('keyModal').style.display = 'none';
    }

    function saveApiKey() {
      const val = document.getElementById('keyInput').value.trim();
      if (val) {
        localStorage.setItem('aira_api_key', val);
        closeKeyModal();
        document.getElementById('status').innerText = 'Key सुरक्षित सेव हो गई सर! अब माइक दबाकर बोलें।';
      }
    }

    // 3D Sphere Animation
    const canvas = document.getElementById('sphereCanvas');
    const ctx = canvas.getContext('2d');
    let angleY = 0;
    let speed = 0.018;
    const dots = [];
    const totalDots = 300;
    const radius = 98;

    for (let i = 0; i < totalDots; i++) {
      const phi = Math.acos(-1 + (2 * i) / totalDots);
      const theta = Math.sqrt(totalDots * Math.PI) * phi;
      dots.push({
        x: radius * Math.cos(theta) * Math.sin(phi),
        y: radius * Math.sin(theta) * Math.sin(phi),
        z: radius * Math.cos(phi),
        isOrange: Math.random() < 0.14
      });
    }

    function drawSphere() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.beginPath();
      ctx.arc(cx, cy, 126, 0.2, Math.PI * 1.6);
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, 136, -0.5, 1.2);
      ctx.strokeStyle = '#ff9900';
      ctx.lineWidth = 2;
      ctx.stroke();

      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 98);
      grad.addColorStop(0, 'rgba(0, 150, 255, 0.55)');
      grad.addColorStop(1, 'rgba(0, 20, 50, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, 98, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < dots.length; i++) {
        const dot = dots[i];
        const x1 = dot.x * Math.cos(angleY) - dot.z * Math.sin(angleY);
        const z1 = dot.z * Math.cos(angleY) + dot.x * Math.sin(angleY);
        const scale = 230 / (230 + z1);
        const px = cx + x1 * scale;
        const py = cy + dot.y * scale;

        ctx.beginPath();
        ctx.arc(px, py, (dot.isOrange ? 2.5 : 2) * scale, 0, Math.PI * 2);
        ctx.fillStyle = dot.isOrange ? '#ff9900' : (z1 < 0 ? '#33f3ff' : '#0077aa');
        ctx.fill();
      }

      angleY += speed;
      requestAnimationFrame(drawSphere);
    }
    drawSphere();

    // Voice & AI Logic
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function speak(text) {
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[*#_]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'hi-IN';
      speed = 0.06;
      utterance.onend = function() { speed = 0.018; };
      window.speechSynthesis.speak(utterance);
    }

    async function askAIRA(command) {
      const apiKey = localStorage.getItem('aira_api_key');
      if (!apiKey) {
        openKeyModal();
        return;
      }

      statusText.innerText = 'सोच रही हूँ सर...';
      const promptText = 'तुम AIRA हो, दिनेश कुमार गुप्ता की पर्सनल सुपर AI। मालिक को "सर" कहो। देश-दुनिया की हर जानकारी दो। अगर कॉल करने कहें तो [CALL:नंबर], यूट्यूब/गाने कहें तो [YT:नाम], गूगल कहें तो [GO:शब्द], जीमेल कहें तो [MAIL:] लिखकर जवाब दो। आदेश: ' + command;

      try {
        const response = await fetch('https://googleapis.com' + apiKey, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            tools: [{ googleSearch: {} }]
          })
        });

        const data = await response.json();
        if (!data.candidates || data.candidates.length === 0) {
          throw new Error(data.error ? data.error.message : 'Invalid API Key');
        }

        let reply = data.candidates[0].content.parts[0].text;

        if (reply.indexOf('[CALL:') !== -1) {
          const match = reply.match(/\[CALL:(.*?)\]/);
          const num = match ? match[1].replace(/[^0-9+]/g, '') : '';
          reply = reply.replace(/\[CALL:.*?\]/, '').trim();
          setTimeout(function() { window.location.href = 'tel:' + num; }, 1000);
        } else if (reply.indexOf('[YT:') !== -1) {
          const match = reply.match(/\[YT:(.*?)\]/);
          const query = match ? match[1] : '';
          reply = reply.replace(/\[YT:.*?\]/, '').trim();
          setTimeout(function() { window.open('https://youtube.com' + encodeURIComponent(query), '_blank'); }, 1000);
        } else if (reply.indexOf('[GO:') !== -1) {
          const match = reply.match(/\[GO:(.*?)\]/);
          const query = match ? match[1] : '';
          reply = reply.replace(/\[GO:.*?\]/, '').trim();
          setTimeout(function() { window.open('https://google.com' + encodeURIComponent(query), '_blank'); }, 1000);
