<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIRA - Personal Super AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: radial-gradient(circle at center, #06182c 0%, #020810 100%);
      color: #00f0ff;
      height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 15px;
    }
    .header {
      width: 100%;
      text-align: center;
      border-bottom: 2px solid #ff9900;
      padding-bottom: 8px;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
      position: relative;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: 6px;
      color: #1ef3ff;
      text-shadow: 0 0 15px #00d9ff, 2px 2px 0px #ff9900;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #ff9900;
      letter-spacing: 2px;
      margin-top: 2px;
    }
    .key-btn {
      position: absolute;
      right: 5px;
      top: 5px;
      background: rgba(255, 153, 0, 0.2);
      border: 1px solid #ff9900;
      color: #ff9900;
      padding: 5px 10px;
      font-size: 0.75rem;
      border-radius: 12px;
      cursor: pointer;
    }
    canvas { display: block; max-width: 100%; }
    .controls { text-align: center; width: 100%; margin-bottom: 10px; }
    #status {
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: #a0e9ff;
      min-height: 55px;
      max-height: 95px;
      overflow-y: auto;
      padding: 0 10px;
    }
    button.mic {
      background: rgba(0, 240, 255, 0.15);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      padding: 14px 38px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      font-weight: bold;
    }
    button.mic.listening {
      background: #00f0ff;
      color: #020810;
      box-shadow: 0 0 25px #ff9900;
      border-color: #ff9900;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AIRA</h1>
    <div class="subtitle">PERSONAL AI OF DINESH KUMAR GUPTA</div>
    <button class="key-btn" onclick="setApiKey()">🔑 Key</button>
  </div>
  
  <canvas id="sphereCanvas"></canvas>
  
  <div class="controls">
    <div id="status">नमस्ते सर, ऊपर 🔑 Key डालें और आदेश दें...</div>
    <button id="micBtn" class="mic">🎤 Speak / बोलें</button>
  </div>

  <script>
    function getApiKey() {
      let key = localStorage.getItem('aira_secret_key');
      if (!key) {
        key = prompt("सर, कृपया अपनी गुप्त API Key यहाँ पेस्ट करें (यह सिर्फ़ आपके फ़ोन में सुरक्षित रहेगी):");
        if (key) localStorage.setItem('aira_secret_key', key.trim());
      }
      return key;
    }

    function setApiKey() {
      const newKey = prompt("नई API Key पेस्ट करें:", localStorage.getItem('aira_secret_key') || "");
      if (newKey !== null && newKey.trim() !== "") {
        localStorage.setItem('aira_secret_key', newKey.trim());
        alert("API Key आपके फ़ोन में सुरक्षित सेव हो गई है सर!");
      }
    }

    const canvas = document.getElementById('sphereCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 275;
    canvas.height = 275;

    let angleY = 0;
    let speed = 0.015;
    const dots = [];
    const totalDots = 280;
    const radius = 90;

    for (let i = 0; i < totalDots; i++) {
      const phi = Math.acos(-1 + (2 * i) / totalDots);
      const theta = Math.sqrt(totalDots * Math.PI) * phi;
      dots.push({
        x: radius * Math.cos(theta) * Math.sin(phi),
        y: radius * Math.sin(theta) * Math.sin(phi),
        z: radius * Math.cos(phi),
        isOrange: Math.random() < 0.12
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.beginPath();
      ctx.arc(cx, cy, 118, 0.2, Math.PI * 1.6);
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, 128, -0.5, 1.2);
      ctx.strokeStyle = '#ff9900';
      ctx.lineWidth = 2;
      ctx.stroke();

      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 90);
      grad.addColorStop(0, 'rgba(0, 140, 255, 0.5)');
      grad.addColorStop(1, 'rgba(0, 20, 50, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, 90, 0, Math.PI * 2);
      ctx.fill();

      dots.forEach(dot => {
        const x1 = dot.x * Math.cos(angleY) - dot.z * Math.sin(angleY);
        const z1 = dot.z * Math.cos(angleY) + dot.x * Math.sin(angleY);
        const scale = 220 / (220 + z1);
        const px = cx + x1 * scale;
        const py = cy + dot.y * scale;

        ctx.beginPath();
        ctx.arc(px, py, (dot.isOrange ? 2.5 : 2) * scale, 0, Math.PI * 2);
        ctx.fillStyle = dot.isOrange ? '#ff9900' : (z1 < 0 ? '#33f3ff' : '#006699');
        ctx.fill();
      });

      angleY += speed;
      requestAnimationFrame(draw);
    }
    draw();

    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let userMemory = localStorage.getItem('aira_memory') || "मालिक का नाम दिनेश कुमार गुप्ता है।";

    function speak(text) {
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[*#_]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'hi-IN';
      speed = 0.06;
      utterance.onend = () => { speed = 0.015; };
      window.speechSynthesis.speak(utterance);
    }

    async function getBatteryInfo() {
      if ('getBattery' in navigator) {
        const battery = await navigator.getBattery();
        const level = Math.round(battery.level * 100);
        const charging = battery.charging ? "चार्ज हो रहा है" : "चार्जिंग पर नहीं है";
        return `सर, आपके फ़ोन की बैटरी अभी ${level} प्रतिशत है और फ़ोन ${charging}।`;
      }
      return "क्षमा करें सर, यह ब्राउज़र बैटरी की जानकारी नहीं दे रहा है।";
    }

    async function processCommandWithAI(command) {
      const apiKey = getApiKey();
      if (!apiKey) {
        statusText.innerText = "कृपया ऊपर 🔑 Key बटन दबाकर अपनी API Key डालें सर।";
        return;
      }

      statusText.innerText = "प्रोसेस कर रही हूँ सर...";
      const lowerCmd = command.toLowerCase();

      if (lowerCmd.includes('battery') || lowerCmd.includes('बैटरी') || lowerCmd.includes('चार्ज')) {
        const batReply = await getBatteryInfo();
        statusText.innerText = batReply;
        speak(batReply);
        return;
      }
      
      if (command.includes('याद रखना') || command.includes('याद रखो') || command.includes('remember')) {
        userMemory += " | " + command;
        localStorage.setItem('aira_memory', userMemory);
      }

      const systemPrompt = `तुम AIRA (आयरा) हो, एक सर्वज्ञानी सुपर AI असिस्टेंट जिसे खास तौर पर सिर्फ़ तुम्हारे मालिक "दिनेश कुमार गुप्ता" के लिए बनाया गया है। 
      तुम्हें देश-दुनिया, विज्ञान, इतिहास, ताज़ा समाचार, मौसम, खेल और हर विषय की पूरी जानकारी है। हमेशा अपने मालिक को "सर" कहकर सम्मान से बात करो।
      मालिक की यादें: [${userMemory}]
      
      नियम:
      - अगर मालिक फ़ोन का कोई काम करने को कहें, तो जवाब की शुरुआत में सही टैग लगाएं:
        1. कॉल लगाने को कहें: [ACTION:CALL:नंबर]
        2. कॉल लॉग्स या किसका फ़ोन आया था पूछें: [ACTION:CALLLOG:]
        3. ईमेल या जीमेल चेक करने को कहें: [ACTION:EMAIL:]
        4. मैसेज या SMS देखने को कहें: [ACTION:SMS:]
        5. यूट्यूब/गाना चलाने को कहें: [ACTION:YOUTUBE:गाने का नाम]
        6. गूगल पर खोजने को कहें: [ACTION:GOOGLE:सर्च शब्द]
        7. व्हाट्सएप खोलने को कहें: [ACTION:WHATSAPP:]
        8. मैप/रास्ता देखने को कहें: [ACTION:MAP:जगह]
      - अगर देश-दुनिया का कोई भी सवाल या जानकारी पूछें, तो बिना टैग के सटीक और छोटा जवाब दें।
      
      मालिक का आदेश: ` + command;

      try {
        const response = await fetch(`https://googleapis.com{apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: systemPrompt }] }],
            tools: [{ googleSearch: {} }]
          })
        });
        const data = await response.json();
        
        if (!data.candidates || !data.candidates[0]) {
          throw new Error(data.error ? data.error.message : "API Error");
        }

        let replyText = data.candidates[0].content.parts[0].text;
        let actionType = null;
        let actionTarget = "";

        const actionMatch = replyText.match(/\[ACTION:(.*?):(.*?)\]/);
        if (actionMatch) {
          actionType = actionMatch[1];
          actionTarget = actionMatch[2];
          replyText = replyText.replace(actionMatch[0], '').trim();
        }

        statusText.innerText = replyText;
        speak(replyText);

        if (actionType) {
          setTimeout(() => {
            if (actionType === "CALL") {
              const num = actionTarget.replace(/[^0-9+]/g, '');
              window.location.href = "tel:" + num;
            } else if (actionType === "CALLLOG") {
              window.location.href = "tel:";
            } else if (actionType === "EMAIL") {
              window.open('https://google.com', '_blank');
            } else if (actionType === "SMS") {
              window.location.href = "sms:";
            } else if (actionType === "YOUTUBE") {
              window.open('https://youtube.com' + encodeURIComponent(actionTarget), '_blank');
            } else if (actionType === "GOOGLE") {
              window.open('https://google.com' + encodeURIComponent(actionTarget), '_blank');
            } else if (actionType === "WHATSAPP") {
